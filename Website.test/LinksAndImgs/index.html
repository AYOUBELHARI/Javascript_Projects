<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Links and Images Demo</title>
    </head>
    <body>
        <h1>Homepage</h1>
        <p>Click the link below to learn more about The Odin Project.</p>
        <a href="https://www.theodinproject.com/about" target="_blank">About the Odin Project</a>
        <!-- This is an absolute link that opens in a new tab due to the target="_blank" attribute. -->
        <p>Click the link below to visit the About Page.</p>
        <a href="Pages/about.html">Go to About Page</a>
        <!-- This is a relative link that navigates to the about.html page within the Pages directory. -->
        <p>Below is the The Odin Project Logo:</p>
        <img src="https://www.theodinproject.com/mstile-310x310.png" alt="The Odin Project Logo" height="310" width="310">
        <!-- The image is sourced from the Images directory and has an alt attribute for accessibility. -->
    </body>
</html>
